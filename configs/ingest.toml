# Ingest settings. Every key maps to a field of fra_ingest.config.IngestConfig.

[statements]
# Detected always. Converted only when enabled. Move a type from optional to enabled to add it.
enabled = ["balance", "income", "comprehensive_income"]
optional = ["cash_flow", "equity"]

[text]
# Fewer non-whitespace characters than this in the text layer makes a page an image page.
min_text_chars = 50
# Top share of the page treated as its header, where statement titles are printed.
header_fraction = 0.35

[ocr]
# Accurate mode only. 100 dpi: at 72 dpi some scans come back nearly empty (Juhayna EN
# standalone p5: 6 lines against 124 at 100 dpi), for about the same time per page.
dpi = 100
languages = ["ar-SA", "en-US"]

[locate]
pad_pages = 1
# Candidate pages above this share of the document raise the low_selectivity flag.
low_selectivity_share = 0.25

[convert]
# mps on the Mac; cpu in the Docker profile.
device = "mps"
# ocrmac on the Mac. none until the week 2 bake-off picks a Linux engine: text ranges
# convert, image ranges are skipped and flagged ocr_unavailable.
ocr_engine = "ocrmac"
# Page images at 2x (144 dpi), for the review report and click-to-source.
images_scale = 2.0
# Resolution docling's OCR renders pages at, as a multiple of 72 dpi. 3.0 is docling's own
# default (216 dpi).
ocr_scale = 3.0
# docling's OCR, layout and table batch sizes. 2 on this machine (01, 1.5).
batch_size = 2
# Task 1.9 compares TableFormer with cell matching on and off.
do_cell_matching = true
# docling's own limit per range, and the parent's limit on the whole child.
document_timeout_s = 600
child_timeout_s = 900
# The ingest child's peak (01, 1.3). Above it the result is flagged, not failed. Raised from
# the 3.0 estimate after measuring 3.19 to 3.28 GB on edita-2025-en-consolidated-eas (spec 10).
memory_budget_gb = 3.5

[artifacts]
root = "var/artifacts"
