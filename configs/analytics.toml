# Analytics settings: the owner decisions of docs/blueprint/06-decisions-and-risks.md.
# Every key maps to a field of fra_analytics.policy.Policy and every key is required. The file
# is flat: a section, or a key the policy does not know, is refused.
# D2, D5 and D6 are fixed rules, not settings: they live in the code and its tests.

# Provisional D1 margin default, pending owner sign-off before the Phase 1 exit gate.
# Zero revenue always returns null with undefined_zero_denominator.
negative_margin_denominator = "compute_and_flag"

# D3: IFRS 16 lease liabilities count in total debt.
include_lease_liabilities = true

# D4: days in a year for DSO, DIO and DPO. Interim periods use their actual days.
day_count_basis = 365
