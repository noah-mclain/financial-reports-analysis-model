# Golden set inventory. All fields measured 2026-09-12.
# text_layer: digital | scanned | mixed  (sampled with pdffonts on pages 1,3,5,7,9)
# statement_pages: 1-based PDF page numbers; null where a scan makes them unknown until OCR runs.
# Vetting method and findings: see README.md

meta:
  collected: 2026-09-12
  method: "pdfinfo, pdftotext character counts, pdffonts and pdfimages per page, macOS Vision OCR spike"
  ocr_reference: "Vision accurate mode, 150 dpi, warm: 24.7 s per page. Fast mode corrupts digits and is unusable for statements."

documents:

  # ---- Tier A: digital, bilingual, page-aligned across languages ----
  - id: almarai-2025-en
    file: documents/almarai-2025-en-annualreport.pdf
    issuer: Almarai Company
    market: Saudi Exchange (Tadawul)
    fiscal_year: 2025
    period_end: 2025-12-31
    language: en
    scope: consolidated
    document_type: annual report (statements embedded)
    framework: IFRS
    currency: SAR
    scale: 1000            # header reads "<riyal glyph> '000"
    pages: 275
    text_layer: mixed      # cover page is an image; all content pages carry text
    statement_pages:
      financial_position: [156, 158]
      profit_or_loss: [159, 159]
      changes_in_equity: [162, 163]
      cash_flows: [164, 166]
    traits: [comparative_prior_year, notes_column, embedded_in_annual_report, currency_glyph_not_extractable]
    source_url: https://annualreport.almarai.com/downloads/pdf/en/full-report.pdf
    retrieved: 2026-09-12
    sha256_prefix: 08ec6e6c61822876
    notes: "Reference document for development. The currency symbol extracts as the letter X, so currency must be read from surrounding text, not the glyph."

