# Calls on the companies in Argaam's listing whose names nearly match an issuer the corpus holds
# (the near-match rule in scripts/argaam_listing.py), each made by reading the two names and the
# listing's short name. Key: the company as Argaam's page names it. `decision` is `same` (it is
# the existing issuer named in `issuer`, so its editions join that issuer and pool), `different`
# (a new issuer, with `against`: the existing issuers and other new companies it was compared with)
# or `exclude` (left out while a doubt stays open). A decision applies to its company whether or
# not its name nearly matches anything, which is how a rename is recorded. `collect` reads this file
# and stops, naming the company, when a near match has no entry here or a `different` decision
# does not cover everything the company is now near.
