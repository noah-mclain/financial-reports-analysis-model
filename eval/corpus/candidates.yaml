# Corpus candidates beyond the golden set.
#
# `verified: <date>` means the file was downloaded and its issuer, language, year and period were
# read from the document itself. `verified: false` means the details come from search results
# and are confirmed by `make corpus-fetch`, which writes measured facts to fetched.yaml.
#
# pool:   dev | train | model_test | blind. Split by issuer (README.md). Pools chosen by hand
#         stay; new issuers get corpus.assign_pool (stable hash: 65/20/15).
# role:   corporate | negative_control   (banks, insurers, finance companies, exchange operators)
# period: annual | interim
# kind:   financial_statements | annual_report | form_10k | prospectus | other
# traits: text_layer_undecodable (text extracts as garbage, needs OCR), ocr_text_layer,
#         scanned

pools:
  dev: "Golden set issuers. Development and debugging happen here."
  train: "Source documents for model training data. Seen by the model, never scored."
  model_test: "Held-out issuers for scoring the model and the pipeline. Never trained on."
  blind: "Never opened during development. Demo documents are picked from here."

