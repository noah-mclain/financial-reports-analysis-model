# Corpus candidates, beyond the golden set. Collected 2026-09-26 from web search results.
#
# Nothing here is verified yet. Issuer, year, language and scope come from search result titles
# and snippets. `make corpus-fetch` downloads each file, measures it, and writes the facts to
# fetched.yaml. Correct an entry here when fetched.yaml disagrees with it.
#
# pool:   dev | train | model_test | blind
#         Split by issuer: every document from one issuer sits in one pool. See README.md.
# role:   corporate | negative_control   (negative_control = bank or insurer, must be declined)
# period: annual | interim

pools:
  dev: "Golden set issuers. Development and debugging happen here."
  train: "Source documents for model training data. Seen by the model, never scored."
  model_test: "Held-out issuers for scoring the model and the pipeline. Never trained on."
  blind: "Never opened during development. Demo documents are picked from here."

