[project]
name = "fra-core"
version = "0.1.0"
description = "Shared contract for the financial statement analysis platform: schemas, parsers, taxonomy."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.11",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fra_core"]
