[project]
name = "fra-model"
version = "0.1.0"
description = "Grounded bilingual direct-template financial summaries."
requires-python = ">=3.12,<3.13"
dependencies = ["fra-core", "fra-analytics"]

[tool.uv.sources]
fra-core = { workspace = true }
fra-analytics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fra_model"]
