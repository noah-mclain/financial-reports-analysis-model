[project]
name = "fra-analytics"
version = "0.1.0"
description = "Analytics: accounting identity checks and deterministic metrics over extracted statements."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fra-core",
]

[tool.uv.sources]
fra-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fra_analytics"]
