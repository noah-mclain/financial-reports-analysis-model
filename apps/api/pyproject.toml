[project]
name = "fra-api"
version = "0.1.0"
description = "HTTP API for the financial statement analysis platform."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "fra-core",
  "uvicorn>=0.34",
]

[tool.uv.sources]
fra-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fra_api"]
