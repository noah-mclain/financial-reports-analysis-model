<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Financial statement analysis{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #595953; --line: #d7d6d0;
    --accent: #15577e; --button-ink: #ffffff; --ok: #205c39; --hold: #765000; --bad: #9f2119;
    --ok-bg: #e7f3ec; --hold-bg: #fbf1d9; --bad-bg: #fbe9e7; --flag: #fff0b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1e; --ink: #ecebe6; --muted: #b8b7b1; --line: #45443f;
      --accent: #8bc5ed; --button-ink: #1d1d1b; --ok: #8bd4a6; --hold: #f0c96c; --bad: #ff9a8e;
      --ok-bg: #1d3326; --hold-bg: #3a2f14; --bad-bg: #3d1f1c; --flag: #4a4116;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", sans-serif; }
  header.top { padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
               display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  header.top a { display: flex; align-items: center; min-height: 44px;
                color: var(--ink); text-decoration: none; font-weight: 600; }
  header.top span { color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 28px; line-height: 1.25; margin: 0 0 12px; overflow-wrap: anywhere; }
  h2 { font-size: 22px; line-height: 1.3; margin: 32px 0 10px; }
  h3 { font-size: 18px; line-height: 1.35; margin: 16px 0 8px; }
  h4 { font-size: 15px; margin: 18px 0 6px; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
           padding: 18px; margin: 14px 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
           font-weight: 600; }
  .badge.completed, .badge.passed, .badge.done { background: var(--ok-bg); color: var(--ok); }
  .badge.needs_review, .badge.skipped, .badge.running { background: var(--hold-bg); color: var(--hold); }
  .badge.failed, .badge.declined { background: var(--bad-bg); color: var(--bad); }
  .badge.waiting { background: var(--bg); color: var(--muted); }
  .verdict { border-radius: 10px; border: 1px solid var(--line); padding: 18px 20px; margin: 12px 0 20px; }
  .verdict.hold { background: var(--hold-bg); } .verdict.bad { background: var(--bad-bg); }
  .verdict.good { background: var(--ok-bg); }
  .verdict h2 { margin: 0 0 8px; }
  .verdict p { margin: 6px 0; }
  .verdict-meta { font-size: 14px; }
  .eyebrow { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .scroll-wrap { margin-block: 12px; }
  .scroll { overflow-x: auto; overscroll-behavior-inline: contain; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 14px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: start;
           vertical-align: top; }
  td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.subtotal td { font-weight: 600; }
  td.flagged { background: var(--flag); }
  .flag-marker { color: var(--hold); font-size: 17px; font-weight: 800; margin-inline-start: 6px; }
  .flag-labels { font-size: 13px; white-space: normal; }
  .flag-labels ul { margin: 4px 0; padding-inline-start: 18px; }
  .line-label { min-width: 190px; }
  .flagged { background: var(--flag); }
  .caveat-mark { display: inline-flex; min-width: 44px; min-height: 44px; align-items: center; justify-content: center; }
  .caveat-note { border-inline-start: 3px solid var(--hold); padding-inline-start: 10px; }
  td.num a { display: inline-flex; align-items: center; min-height: 44px; color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .metric-detail li > a, .metric-card h4 a { display: inline-flex; align-items: center; min-height: 44px; }
  td.num a:hover { color: var(--accent); }
  code { font-size: 13px; overflow-wrap: anywhere; }
  #analysis-results .technical-details { margin-block: 8px; }
  #analysis-results .technical-details ul { margin: 4px 0; padding-inline-start: 20px; }
  #analysis-results .flag-labels { margin: 4px 0; padding-inline-start: 20px; font-size: 13px; }
  .reasons, .plain-reasons { margin: 8px 0 0; padding-inline-start: 22px; }
  .page-index { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
  .page-index a { display: inline-flex; align-items: center; min-height: 44px; }
  .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 12px 0; }
  .metric-card { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .metric-card h4 { margin: 0; }
  .metric-card h4 a { color: inherit; }
  .metric-period { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
  .metric-value { margin: 8px 0 0; font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
  .section-details, .statement-detail, .metric-detail { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin: 12px 0; }
  .statement-group { margin: 18px 0 24px; }
  .statement-detail summary, .section-details > summary { gap: 12px; }
  .statement-detail summary span:last-child { margin-inline-start: auto; color: var(--muted); }
  .statement-panel { border: 0; border-radius: 0; border-top: 1px solid var(--line); margin: 0; }
  .metric-detail { margin: 10px; padding: 0 12px 12px; }
  .metric-detail > summary { display: grid; grid-template-columns: minmax(120px, 1fr) 120px minmax(100px, auto); gap: 12px; }
  .metric-detail > summary span:last-child { text-align: end; font-variant-numeric: tabular-nums; }
  details > summary { cursor: pointer; padding: 10px 12px; min-height: 48px; }
  details[open] > summary { border-bottom: 1px solid var(--line); }
  .scroll-cue { margin: 0 0 6px; font-size: 14px; }
  .job-result-link a { display: inline-flex; align-items: center; min-height: 44px; }
  .scroll:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 3px; }
  a { color: var(--accent); }
  button { font: inherit; min-height: 44px; padding: 8px 16px; border-radius: 6px; border: 0; background: var(--accent);
           color: var(--button-ink); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  input[type="file"] { min-height: 44px; max-width: 100%; }
  @media (max-width: 900px) { .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) {
    main { padding: 20px 12px 48px; }
    header.top { padding: 10px 12px; }
    .metric-grid { grid-template-columns: 1fr; }
    .metric-detail > summary { grid-template-columns: minmax(0, 1fr); gap: 2px; }
    .metric-detail > summary span:last-child { text-align: start; }
    .statement-detail summary { flex-wrap: wrap; }
    .statement-detail summary span:last-child { margin-inline-start: 0; }
    .verdict, .panel { padding: 14px; }
  }
</style>
</head>
<body>
<header class="top"><a href="/">Financial statement analysis</a><span>{{ profile }} profile</span></header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
