<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Financial statement analysis{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
    --accent: #1f5f8b; --ok: #2e7d4f; --hold: #9a6a00; --bad: #b3261e;
    --ok-bg: #e7f3ec; --hold-bg: #fbf1d9; --bad-bg: #fbe9e7; --flag: #fff3c4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1e; --ink: #ecebe6; --muted: #a3a29c; --line: #34332f;
      --accent: #7db7e0; --ok: #7cc79a; --hold: #e3b85a; --bad: #f08a80;
      --ok-bg: #1d3326; --hold-bg: #3a2f14; --bad-bg: #3d1f1c; --flag: #4a4116;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans Arabic", sans-serif; }
  header.top { padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
               display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  header.top a { color: var(--ink); text-decoration: none; font-weight: 600; }
  header.top span { color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 32px 0 8px; }
  h3 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 16px; margin: 12px 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
           font-weight: 600; }
  .badge.completed, .badge.passed, .badge.done { background: var(--ok-bg); color: var(--ok); }
  .badge.needs_review, .badge.skipped, .badge.running { background: var(--hold-bg); color: var(--hold); }
  .badge.failed, .badge.declined { background: var(--bad-bg); color: var(--bad); }
  .badge.waiting { background: var(--bg); color: var(--muted); }
  .banner { border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
  .banner.hold { background: var(--hold-bg); } .banner.bad { background: var(--bad-bg); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: start;
           vertical-align: top; }
  td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.subtotal td { font-weight: 600; }
  td.flagged { background: var(--flag); }
  td.num a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
  td.num a:hover { color: var(--accent); }
  code { font-size: 13px; }
  .reasons { margin: 6px 0 0; padding-inline-start: 18px; font-size: 13px; }
  a { color: var(--accent); }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 0; background: var(--accent);
           color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header class="top"><a href="/">Financial statement analysis</a><span>{{ profile }} profile</span></header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
