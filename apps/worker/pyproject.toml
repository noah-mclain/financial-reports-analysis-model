[project]
name = "fra-worker"
version = "0.1.0"
description = "Runs queued analysis jobs: ingest, metrics, and the analysis each job leaves."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fra-analytics",
  "fra-core",
  "fra-ingest",
]

[project.scripts]
fra-worker = "fra_worker.main:main"

[tool.uv.sources]
fra-analytics = { workspace = true }
fra-core = { workspace = true }
fra-ingest = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fra_worker"]
