[project]
# Not installable (package = false). Depends on the members so `uv run` doesn't uninstall
# them between commands.
name = "fra-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fra-api",
  "fra-core",
  "fra-ingest[mac]",
  # Direct dependencies only so the sources below apply: uv honours [tool.uv.sources] for a
  # package only when the project names it itself. They pin the versions both profiles run.
  "torch==2.14.0",
  "torchvision==0.29.0",
  # Named here, with the override below, in place of the GUI build that rapidocr asks for.
  "opencv-python-headless==5.0.0.93",
]

[tool.uv]
package = false
# rapidocr (pulled in by docling) asks for opencv-python, whose GUI build needs libxcb, libGL and
# more than the slim image has. Disable that requirement and take the headless wheel, which
# provides the same cv2 module; the two wheels must never be installed side by side.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.uv.workspace]
# Members are added on the day their package lands, so `uv sync` stays green at every commit.
# Still to come (see docs/blueprint/08-revised-plan.md): packages/analytics,
# packages/modeling, apps/worker
members = [
  "apps/api",
  "packages/core",
  "packages/ingest",
]

[tool.uv.sources]
fra-api = { workspace = true }
fra-core = { workspace = true }
fra-ingest = { workspace = true }
# Linux (the Docker image) gets CPU wheels, which drop the CUDA libraries and triton; macOS
# keeps the default wheels.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.4",
  "pytest-cov>=6.0",
  "hypothesis>=6.130",
  "ruff>=0.14",
  "mypy>=1.18",
  "types-PyYAML>=6.0",
  "pypdfium2>=4.30",
  "truststore>=0.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "apps/*/src", "scripts", "training/sources"]
# Code blocks in docs are design sketches (aligned comments, elided bodies), not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002/RUF003 flag "ambiguous" Unicode. This project handles Arabic text on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Keep in sync with workspace members.
mypy_path = "apps/api/src:packages/core/src:packages/ingest/src:packages/ingest/tests"

[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "mlx.*", "mlx_lm.*", "pypdfium2.*", "matplotlib.*", "ocrmac", "ocrmac.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# docling_core.types.doc re-exports ImageRefMode (and others) without an __all__ entry.
module = "docling_core.types.doc"
implicit_reexport = true

[tool.pytest.ini_options]
# The directories that hold workspace members' tests; keep in sync with the members list.
testpaths = ["apps", "packages", "tests"]
# Keep in sync with workspace members. uv marks editable .pth files hidden on macOS and
# Python 3.11+ skips hidden .pth files, so tests set the paths directly.
# `make unhide-pth` fixes it for scripts and `uv run python`.
pythonpath = ["apps/api/src", "packages/core/src", "packages/ingest/src", "scripts", "training/sources", "eval"]
addopts = "-q --strict-markers"
markers = [
  "slow: needs model weights or OCR, excluded from the default run",
  "golden: reads documents from eval/golden",
]
