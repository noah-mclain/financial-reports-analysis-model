[project]
# Not installable (package = false). Depends on the members so `uv run` doesn't uninstall
# them between commands.
name = "fra-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fra-core",
  "fra-ingest[mac]",
]

[tool.uv]
package = false

[tool.uv.workspace]
# Members are added on the day their package lands, so `uv sync` stays green at every commit.
# Still to come (see docs/blueprint/08-revised-plan.md): packages/analytics,
# packages/modeling, apps/api, apps/worker
members = [
  "packages/core",
  "packages/ingest",
]

[tool.uv.sources]
fra-core = { workspace = true }
fra-ingest = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.0",
  "hypothesis>=6.130",
  "ruff>=0.14",
  "mypy>=1.18",
  "types-PyYAML>=6.0",
  "pypdfium2>=4.30",
  "truststore>=0.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "apps/*/src", "scripts", "training/sources"]
# Code blocks in docs are design sketches (aligned comments, elided bodies), not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002/RUF003 flag "ambiguous" Unicode. This project handles Arabic text on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "packages/core/src:packages/ingest/src:packages/ingest/tests:packages/analytics/src:packages/modeling/src"

[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "mlx.*", "mlx_lm.*", "pypdfium2.*", "matplotlib.*", "ocrmac", "ocrmac.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Extend as apps/ lands.
testpaths = ["packages", "tests"]
# Keep in sync with workspace members. uv marks editable .pth files hidden on macOS and
# Python 3.11+ skips hidden .pth files, so tests set the paths directly.
# `make unhide-pth` fixes it for scripts and `uv run python`.
pythonpath = ["packages/core/src", "packages/ingest/src", "scripts", "training/sources", "eval"]
addopts = "-q --strict-markers"
markers = [
  "slow: needs model weights or OCR, excluded from the default run",
  "golden: reads documents from eval/golden",
]
