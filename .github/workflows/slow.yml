name: Slow tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/slow.yml
      - scripts/ci/docling_models.py
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: 'true'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  FRA_PROFILE: docker
  FRA_OCR_ENGINE: tesseract

jobs:
  slow-linux:
    name: Slow tests, Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the locked workspace with Tesseract
        uses: ./.github/actions/workspace
        with:
          tesseract: 'true'
      - name: Name the model cache after the locked docling versions
        id: models
        run: echo "key=$(uv run python scripts/ci/docling_models.py key)-${RUNNER_OS}" >> "$GITHUB_OUTPUT"
      - name: Restore the docling models
        id: model-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ steps.models.outputs.key }}
      # The only step that may reach the network. Every other step runs offline, so a model
      # missing from the cache fails loudly.
      - name: Download the docling models on a cache miss
        if: ${{ steps.model-cache.outputs.cache-hit != 'true' }}
        env:
          HF_HUB_OFFLINE: '0'
        run: uv run python scripts/ci/docling_models.py warm
      - name: Run the slow tests that do not need a Mac
        run: uv run pytest -m "slow and not mac" -rs
