name: Slow tests

on:
  pull_request:
    branches: [main]
    # What the slow tests and their environment depend on: the workflow and the composite actions
    # (the workspace action reads the Dockerfile), the lock and the Python version, the CI
    # scripts, the code the tests exercise and the golden documents they read.
    paths:
      - .github/workflows/slow.yml
      - .github/actions/workspace/**
      - .github/actions/docling-models/**
      - docker/Dockerfile
      - scripts/ci/docling_models.py
      - scripts/ci/tesseract-packages.sh
      - uv.lock
      - pyproject.toml
      - .python-version
      - configs/**
      - conftest.py
      - cache_isolation.py
      - packages/**
      - tests/**
      - eval/harness/**
      - eval/golden/**
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: 'true'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  FRA_PROFILE: docker
  FRA_OCR_ENGINE: tesseract
  # A skipped test means the runner lacks something the tests need, so it fails the job.
  FRA_FAIL_ON_SKIP: '1'

jobs:
  slow-linux:
    name: Slow tests, Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the locked workspace with Tesseract
        uses: ./.github/actions/workspace
        with:
          tesseract: 'true'
      # Only the tests need a font with Arabic letters (they draw the images the OCR engines
      # read); the product does not, so this is not in the Dockerfile.
      - name: Install the font the OCR tests draw with
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-dejavu-core
      - name: Provide the docling models, offline after this step
        uses: ./.github/actions/docling-models
      - name: Run the slow tests that do not need a Mac
        run: uv run pytest -m "slow and not mac" -rs
