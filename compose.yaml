# Docker run profile. `make docker-up` starts api and worker; the llm service needs a model file
# and starts only with `--profile llm`. Ports come from .env, which compose reads itself.
# Nothing is passed with env_file: a port reaches a container only through the lines below, so
# the mapping, the health check and the process cannot disagree.
name: fra

services:
  # The one build: api and worker run the same image, tagged fra-app.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: fra-app
    environment:
      FRA_API_PORT: "${FRA_API_PORT:?set FRA_API_PORT in .env}"
    ports:
      - "127.0.0.1:${FRA_API_PORT:?set FRA_API_PORT in .env}:${FRA_API_PORT}"
    # The job store and its files, shared with the worker (configs/jobs.toml, storage.root).
    volumes:
      - fra-var:/app/var
    healthcheck:
      test: ["CMD", "python", "-m", "fra_api.healthcheck", "${FRA_API_PORT}", "--profile", "docker"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # The worker (apps/worker): claims the jobs the api queues in the shared volume and runs them.
  # It builds the OCR engine FRA_OCR_ENGINE names at start, so a missing engine or language data
  # stops it at once. `init` makes docker's stop signal reach it so it exits at once.
  # The image is built by `docker compose build api` or `make docker-up`; `build worker` builds
  # nothing, so a lone `up --build worker` would run a stale image.
  worker:
    image: fra-app
    pull_policy: never  # built by api; there is nothing to pull
    init: true
    volumes:
      - fra-var:/app/var
      - ./var/models:/app/var/models:ro
    environment:
      FRA_NORMALIZATION_ENABLED: "${FRA_NORMALIZATION_ENABLED:-0}"
      FRA_LLM_PORT: "${FRA_LLM_PORT:?set FRA_LLM_PORT in .env}"
    command: ["fra-worker"]

  # Optional CPU server. The pinned full image was inspected for the R19 benchmark.
  # Both processes see the same absolute model path; only the worker hashes its bytes.
  llm:
    profiles: [llm]
    image: ghcr.io/ggml-org/llama.cpp@sha256:139d4c374d80269e0b706c55901b0b4caea3d5caa4734d5652b299a2f3da9503
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      FRA_LLM_PORT: "${FRA_LLM_PORT:?set FRA_LLM_PORT in .env}"
    command:
      - |
        exec python3 /config/normalization_config.py --config /config/normalization.toml --root /app --port "$$FRA_LLM_PORT"
    volumes:
      - ./configs/normalization.toml:/config/normalization.toml:ro
      - ./packages/core/src/fra_core/normalization_config.py:/config/normalization_config.py:ro
      - ./var/models:/app/var/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$$FRA_LLM_PORT/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  # Created from the image's /app/var, so it starts owned by the app user.
  fra-var: {}
