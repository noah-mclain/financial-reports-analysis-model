  canonical_id: null
  doc_phrases:
  - Value of all classes of common stock held by shareholders. May be all or
  - Value of common shares held by shareholders. Excludes common shares repurchased
  reason: Value of shares held by shareholders, which can differ from issued capital.
- statement: BS
  tag: AdditionalPaidInCapital
  canonical_id: null
  doc_phrases:
  - Amount of excess of issue price over par or stated value of stock and from
  reason: Share premium has no item in the taxonomy; it is not share capital.
- statement: BS
  tag: RetainedEarningsAccumulatedDeficit
  canonical_id: retained_earnings
  doc_phrases:
  - Amount of accumulated undistributed earnings (deficit)
  reason: Accumulated undistributed earnings or deficit; the retained earnings line.
- statement: BS
  tag: AccumulatedOtherComprehensiveIncomeLossNetOfTax
  canonical_id: null
  doc_phrases:
  - Amount, after tax, of accumulated increase (decrease) in equity from
  reason: Accumulated other comprehensive income is not the same as the reserves the item names.
- statement: BS
  tag: MinorityInterest
  canonical_id: non_controlling_interests
  doc_phrases:
  - Amount of equity (deficit) attributable to noncontrolling interest. Excludes
  reason: Equity attributable to the noncontrolling interest; the item's own scope.
- statement: BS
  tag: StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest
  canonical_id: total_equity
  doc_phrases:
  - Amount of equity (deficit) attributable to parent and noncontrolling interest.
  reason: Equity of the parent and the noncontrolling interest; the total equity subtotal.
- statement: BS
  tag: LiabilitiesAndStockholdersEquity
  canonical_id: total_liabilities_and_equity
  doc_phrases:
  - Amount of liabilities and equity items, including the portion of equity
  reason: Liabilities and equity including the noncontrolling share; the balancing total.
