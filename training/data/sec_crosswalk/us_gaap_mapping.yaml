# Curated mapping of standard us-gaap tags to canonical item ids, with explicit nulls.
# Consumed by training/sec_crosswalk_draft.py. A row is (statement code, tag, target, reason):
#   statement  BS (balance sheet) or IS (income statement), the pre.txt stmt code of the line.
#   canonical_id  a taxonomy item id on that statement, or null for an explicit abstention.
#   doc_phrases  words from the tag's own definition in tag.txt. A definition can be reworded
#                between tag taxonomy versions, so several phrases may be listed; the draft
#                builder refuses a tag whose definition in any version holds none of them,
#                so a reworded definition is looked at again before it is used.
#   reason  why the tag means exactly that item, or why it is left null.
#   excluded  tags whose item depends on whether a noncontrolling interest is shown. The decoder
#             drops them before resolution (reason ambiguous_semantics); they are neither mapped,
#             null nor covered by an abstention policy.
# Alias rule: map when the item's aliases list the concept without a qualifier; null when the tag
# is narrower than, broader than or ambiguous between items.
# Only exact equivalence is mapped. Near-synonyms and tags that cover two items are null.
# Nothing here is approved; see docs/runbooks/sec-crosswalk-data.md.
version: 1
namespace: us-gaap
unmapped_items:
  net_income_attributable_parent: Its only standard tag, NetIncomeLoss, is excluded as ambiguous with net_income.
  equity_attributable_parent: Its only standard tag, StockholdersEquity, is excluded as ambiguous with total_equity.
  other_reserves: No standard tag means reserves in the IFRS sense; accumulated other comprehensive income and paid-in capital are different things.
excluded:
- statement: IS
  tag: NetIncomeLoss
  reason: Defined as the parent's share only. Filers without a noncontrolling interest print it as plain net income, so the tag alone cannot choose between net_income and net_income_attributable_parent. Dropped before resolution, not taught as abstention.
- statement: BS
  tag: StockholdersEquity
  reason: Defined as the parent's share only. Filers without a noncontrolling interest print it as total equity, so the tag alone cannot choose between equity_attributable_parent and total_equity. Dropped before resolution, not taught as abstention.
